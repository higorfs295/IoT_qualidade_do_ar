; =============================================================================
;  PlatformIO — Firmware da Estacao de Qualidade do Ar (base_final)
; =============================================================================
;  Placa: ESP32 DevKit V1. Framework Arduino.
;
;  Modo do sensor: por padrao SIMULADO (HIL). Para o protótipo fisico, mude
;  MODO_SENSOR em src/config.h (ou passe -D MODO_SENSOR=FONTE_FISICA aqui) e
;  habilite as bibliotecas dos sensores abaixo.
; =============================================================================

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Bibliotecas sempre necessarias -----------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0     ; serializacao do payload e parse do HIL
    knolleary/PubSubClient @ ^2.8      ; cliente MQTT

; --- Bibliotecas do modo FISICO (descomente ao montar o protótipo) ----------
;   adafruit/Adafruit SHT31 Library    ; SHT31-D  (temp/umidade)
;   sensirion/Sensirion I2C SGP40      ; SGP40    (voc_index)
;   sensirion/Sensirion I2C SCD4x      ; SCD41    (co2)
;   fu-hsi/PMS Library                 ; PMS7003  (particulados)

; PubSubClient publica em QoS 0; o contrato pede QoS 1. Para QoS 1 de saida
; real, avalie trocar por uma lib MQTT assincrona numa evolucao (ver
; publicador_mqtt.cpp). O buffer MQTT ja e ampliado no codigo (setBufferSize).
build_flags =
    -DMQTT_MAX_PACKET_SIZE=768
