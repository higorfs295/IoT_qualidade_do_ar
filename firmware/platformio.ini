; Firmware da Estacao de Qualidade do Ar - ESP32 DevKit V1
; Use `pio run -e esp32-hil` sem sensores e `pio run -e esp32-fisico` na bancada.

[platformio]
default_envs = esp32-hil

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    256dpi/MQTT @ 2.5.3
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
    -D CORE_DEBUG_LEVEL=1

[env:esp32-hil]
build_flags =
    ${env.build_flags}
    -D MODO_SENSOR=0

[env:esp32-fisico]
build_flags =
    ${env.build_flags}
    -D MODO_SENSOR=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SHT31 Library @ 2.2.2
    sensirion/Sensirion I2C SCD4x @ 1.1.0
    sensirion/Sensirion I2C SGP40 @ 0.1.0
    sensirion/Sensirion Gas Index Algorithm @ 3.2.3
