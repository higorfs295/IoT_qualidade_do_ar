# =============================================================================
#  Mosquitto - configuracao do broker da PoC de ingestao (Atividade 3)
#  Projeto: Monitoramento de Qualidade do Ar
# =============================================================================
#
#  Esta configuracao serve tanto ao docker-compose.yml (broker containerizado
#  para o teste de carga) quanto de referencia para o setup_ubuntu_broker.sh
#  (broker em uma VM Ubuntu). Os valores foram ajustados pensando em milhares
#  de conexoes simultaneas e na reducao de latencia sob rajadas.
#
#  ATENCAO: o listener 1883 abaixo aceita conexao anonima, adequado APENAS
#  para a PoC em rede local/isolada. Para expor o broker, habilite TLS (8883),
#  desabilite o anonimo e use o arquivo de senhas + ACL (blocos comentados).
# =============================================================================

# -----------------------------------------------------------------------------
# Identificacao e persistencia
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
# Grava o banco de sessoes/retidas a cada 30 min ou 10 mil alteracoes.
autosave_interval 1800
autosave_on_changes false

# Logs em stdout (capturados pelo Docker) e tambem em arquivo.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Intervalo de publicacao das metricas internas em $SYS (0 desativa).
sys_interval 10

# -----------------------------------------------------------------------------
# Ajuste de desempenho e concorrencia
# -----------------------------------------------------------------------------
# Sem limite artificial de conexoes simultaneas (o teto real vem do ulimit do
# sistema operacional - ver setup_ubuntu_broker.sh, que eleva o nofile).
max_connections -1

# Mensagens QoS>0 em transito por cliente. Elevar ajuda o rendimento sob
# rajadas; o gerador de carga usa max-inflight compativel do lado do cliente.
max_inflight_messages 100

# Fila de mensagens QoS>0 por cliente enquanto ele estiver offline/lento.
# 0 = ilimitado. Aqui limitamos para proteger a memoria do broker sob picos.
max_queued_messages 2000

# Descarta as mensagens mais antigas quando a fila enche, em vez das novas:
# preserva os dados mais recentes de qualidade do ar.
queue_qos0_messages false

# Tamanho maximo do pacote MQTT aceito (bytes). O contrato v1.0 ocupa ~420 B;
# 8 KiB deixa folga e barra mensagens anomalas. (max_packet_size substitui o
# antigo message_size_limit no Mosquitto 2.x.)
max_packet_size 8192

# Limite de memoria do broker (0 = sem limite imposto pelo Mosquitto).
memory_limit 0

# -----------------------------------------------------------------------------
# Listener 1883 - MQTT em texto (PoC local / rede isolada)
# -----------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# -----------------------------------------------------------------------------
# Listener 8883 - MQTT sobre TLS (recomendado para exposicao)
# -----------------------------------------------------------------------------
# Descomente e forneca os certificados (o setup_ubuntu_broker.sh pode gerar
# uma CA de teste). Em producao, use certificado por dispositivo (mTLS),
# coerente com o plano de AWS IoT Core em infra/aws/planejamento_servicos.md.
#
# listener 8883 0.0.0.0
# protocol mqtt
# allow_anonymous false
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# tls_version tlsv1.2
# require_certificate false        # true = exige certificado do cliente (mTLS)

# -----------------------------------------------------------------------------
# Autenticacao e autorizacao (habilite ao desativar o anonimo)
# -----------------------------------------------------------------------------
# password_file /mosquitto/config/passwd
# acl_file      /mosquitto/config/aclfile
